services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "5000:5000"
    depends_on:
      - qdrant
    volumes:
      - hf_cache:/root/.cache/huggingface

volumes:
  qdrant_storage:
  hf_cache:
